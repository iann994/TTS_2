<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文對話練習｜WebSpeech 完整版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='5' width='18' height='14' rx='4' fill='%234f46e5'/%3E%3Ccircle cx='9' cy='12' r='2.5' fill='white'/%3E%3Ccircle cx='15' cy='12' r='2.5' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --main:#1e293b; --muted:#64748b;
    --a:#4f46e5; --b:#059669; --border:#cbd5e1; --err:#dc2626;
    --ok-bg:#dcfce7; --ok-text:#166534; --err-bg:#fee2e2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--main);
    display:flex; justify-content:center; padding:16px 12px 40px;
  }
  .container{width:100%;max-width:620px;display:flex;flex-direction:column;gap:14px;position:relative;}
  header{display:flex;align-items:center;gap:10px;}
  header .logo{
    width:38px;height:38px;border-radius:10px;background:var(--a);flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  header h1{font-size:1.2rem;margin:0;line-height:1.3;}
  header p{font-size:.78rem;color:var(--muted);margin:2px 0 0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .status{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;padding:10px 12px;border-radius:10px;background:#e2e8f0;line-height:1.5;}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#2563eb;flex:none;margin-top:5px;}
  .speaker-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .speaker-tag{font-weight:800;font-size:.88rem;}
  .s-a .speaker-tag{color:var(--a);}
  .s-b .speaker-tag{color:var(--b);}
  .card.s-a{border-left:5px solid var(--a);}
  .card.s-b{border-left:5px solid var(--b);}
  .card .label{font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .line{font-size:1.1rem;line-height:1.6;word-break:break-word;}
  .speak-btn{border:none;background:#eef2ff;color:var(--a);border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .mic-card{display:flex;flex-direction:column;gap:10px;}
  .mic-top{display:flex;align-items:center;justify-content:space-between;}
  .rec-btn{
    border:none;background:var(--err);color:#fff;border-radius:10px;padding:12px 16px;
    font-size:1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;flex:none;
  }
  .rec-btn.listening{background:#7f1d1d;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .rec-btn:disabled{opacity:.45;cursor:not-allowed;}
  .mic-state{font-size:.82rem;color:var(--muted);font-weight:600;}
  .heard-box{border:1.5px dashed #a5b4fc;background:#eef2ff;border-radius:12px;padding:12px;}
  .heard-box .h-label{font-size:.75rem;font-weight:800;color:var(--a);display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .heard-box .h-label svg{flex:none;}
  .heard-text{font-size:1.25rem;line-height:1.5;word-break:break-word;min-height:1.4em;color:#312e81;}
  .heard-text.placeholder{color:#9aa5c1;font-size:1rem;}
  .edit-input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;}
  .edit-input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
  .controls{display:flex;gap:8px;flex-wrap:wrap;}
  .ctrl-btn{
    flex:1;min-width:96px;border:none;border-radius:10px;padding:13px 0;font-size:.95rem;font-weight:700;cursor:pointer;color:#fff;
  }
  .ctrl-btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-check{background:var(--a);}
  .btn-slow{background:#9333ea;}
  .btn-next{background:#059669;}
  .diff-view{display:none;flex-direction:column;gap:8px;}
  .diff-view.show{display:flex;}
  .diff-box{border-radius:10px;padding:10px 12px;line-height:1.7;font-size:1.02rem;word-break:break-word;}
  .diff-box .d-label{font-size:.72rem;font-weight:800;color:var(--muted);margin-bottom:2px;}
  .diff-box.correct{background:var(--ok-bg);}
  .diff-box.user{background:var(--err-bg);}
  .diff-box .d-label.good{color:var(--ok-text);}
  .diff-box .d-label.bad{color:var(--err);}
  .diff-red{color:var(--err);font-weight:900;}
  .editor-title{font-weight:700;font-size:.92rem;color:var(--a);margin-bottom:8px;}
  .editor textarea{width:100%;height:130px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;resize:vertical;}
  .editor .hint{font-size:.72rem;color:var(--muted);margin:4px 0;}
  .editor .mini-btn{border:none;background:var(--a);color:#fff;border-radius:8px;padding:9px 14px;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:6px;}
  .success-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:999;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .success-overlay.show{ opacity:1; pointer-events:auto; }
  .success-badge{
    background:#ffffff; padding:30px 40px; border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    display:flex; flex-direction:column; align-items:center; gap:12px;
    transform:scale(0.7); transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .success-overlay.show .success-badge{ transform:scale(1); }
  .check-icon{
    width:70px; height:70px; border-radius:50%; background:#dcfce7; color:#166534;
    display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:bold;
  }
  .success-text{ font-size:1.1rem; font-weight:800; color:#166534; margin:0; }
  svg{display:inline-block;vertical-align:middle;}
</style>
</head>
<body>
<div class="success-overlay" id="successOverlay">
  <div class="success-badge">
    <div class="check-icon">✓</div>
    <p class="success-text">太棒了！答對囉！</p>
  </div>
</div>
<div class="container">
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" /></svg>
    </div>
    <div>
      <h1>英文對話練習・口說陪練</h1>
      <p>精準名字修復版（修正 to you -> qiyu）</p>
    </div>
  </header>
  <div class="status">
    <span class="dot"></span>
    <span id="statusText">請先點擊畫面任意處解鎖聲音；需使用 HTTPS / localhost 才能開啟麥克風。</span>
  </div>
  <div class="card editor">
    <div class="editor-title">編輯 A-B 對話劇本（每行一句，奇數 A 系統、偶數 B 標準答案）</div>
    <div style="font-size:0.75rem; color:var(--muted); margin-bottom:4px;">SPEAKER A 台詞（一行一句）：</div>
    <textarea id="scriptA" placeholder="A 台詞，一行一句"></textarea>
    <div style="font-size:0.75rem; color:var(--muted); margin:6px 0 4px;">SPEAKER B 標準答案（一行一句，與 A 依序對應）：</div>
    <textarea id="scriptB" placeholder="B 標準答案，一行一句"></textarea>
    <div class="hint">修改後點「更新劇本」就會立刻套用並從第一組開始！</div>
    <button class="mini-btn" onclick="updateScript()">更新劇本</button>
  </div>
  <div class="card s-a">
    <div class="speaker-row">
      <span class="speaker-tag">SPEAKER A（系統台詞）</span>
      <button class="speak-btn" onclick="speakA(getCurrent().A)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>
        播放
      </button>
    </div>
    <div class="line" id="lineA">…</div>
  </div>
  <div class="card s-b">
    <div class="speaker-row">
      <span class="speaker-tag">SPEAKER B（標準答案）</span>
    </div>
    <div class="line" id="lineB">…</div>
  </div>
  <div class="card mic-card">
    <div class="mic-top">
      <button class="rec-btn" id="recBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="23" /><line x1="8" y1="23" x2="16" y2="23" /></svg>
        <span id="recLabel">開始說話</span>
      </button>
      <span class="mic-state" id="micState">麥克風待命</span>
    </div>
    <div class="heard-box">
      <div class="h-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /></svg>
        你剛才說的文字
      </div>
      <div class="heard-text placeholder" id="heardText">（說英文後，辨識結果會顯示在這裡）</div>
    </div>
    <input class="edit-input" id="userInput" type="text" placeholder="也可直接打字修改後按檢查" autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="done">
  </div>
  <div class="controls">
    <button class="ctrl-btn btn-check" id="checkBtn" onclick="doCheck()">檢查句子</button>
    <button class="ctrl-btn btn-slow" id="slowBtn" onclick="speakSubSentenceSlow()" disabled>慢速 0.4x 播放</button>
    <button class="ctrl-btn btn-next" id="nextBtn" onclick="nextRound()" disabled>下一組</button>
  </div>
  <div class="diff-view" id="diffView">
    <div class="diff-box correct" id="diffCorrect"></div>
    <div class="diff-box user" id="diffUser"></div>
  </div>
</div>
<script>
  // 強效專用校正函式
  function processNameCorrections(userRaw, targetB) {
    if (!userRaw) return userRaw;
    let t = userRaw;
    const targetB_lower = targetB.toLowerCase();

    // 1. 如果標準答案有 qiyu
    if (targetB_lower.includes('qiyu')) {
      // 針對最常見的極度誤判字組合（包含 to you, do you, kill you, key you, see you, clear 等）進行直接替換
      t = t.replace(/\b(to\s*you|do\s*you|kill\s*you|key\s*you|see\s*you|can\s*you|give\s*you|kio|keyu|kiyu|qiu|clear|kiel|ke\s*yu)\b/gi, 'qiyu');
      // 如果經過第一階段替換後依然沒有 qiyu，但句子最後或最前出現單字 you
      if (!t.toLowerCase().includes('qiyu') && /\byou\b/i.test(t)) {
        t = t.replace(/\b(to|do|kill|key|see|can|give)?\s*you\b/gi, 'qiyu');
      }
    }

    // 2. 如果標準答案有 shen xinghui
    if (targetB_lower.includes('shen xinghui')) {
      t = t.replace(/\b(shen\s*xing\s*hui|shen\s*xing\s*way|shen\s*shin\s*hui|shen\s*seeing\s*way|shen\s*sing\s*way|sing\s*way)\b/gi, 'shen xinghui');
    }

    // 3. 如果標準答案有 qin che
    if (targetB_lower.includes('qin che')) {
      t = t.replace(/\b(qin\s*che|chin\s*che|qin\s*chair|chin\s*chair|can\s*check|kin\s*check|pin\s*chair)\b/gi, 'qin che');
    }

    return t;
  }

  const defaultA = `What did you do yesterday?
How long have you lived here?
Are you going to join the party?`;
  const defaultB = `I watched a movie with my sister.
I have lived here for five years.
I am not sure if I have time.`;
  const pairs = [];          
  let currentIdx = 0;
  let audioUnlocked = false;
  let recognition = null;
  let firstErrorWordIndex = -1;
  const statusText = document.getElementById('statusText');
  const lineA = document.getElementById('lineA');
  const lineB = document.getElementById('lineB');
  const heardText = document.getElementById('heardText');
  const userInput = document.getElementById('userInput');
  const recBtn = document.getElementById('recBtn');
  const recLabel = document.getElementById('recLabel');
  const micState = document.getElementById('micState');
  const checkBtn = document.getElementById('checkBtn');
  const slowBtn = document.getElementById('slowBtn');
  const nextBtn = document.getElementById('nextBtn');
  const diffView = document.getElementById('diffView');
  const diffCorrect = document.getElementById('diffCorrect');
  const diffUser = document.getElementById('diffUser');
  const scriptA = document.getElementById('scriptA');
  const scriptB = document.getElementById('scriptB');
  const successOverlay = document.getElementById('successOverlay');

  function getCurrent() {
    return pairs[currentIdx] || { A: '', B: '' };
  }

  document.addEventListener('click', unlockAudio);
  document.addEventListener('touchstart', unlockAudio);
  function unlockAudio(){
    if (audioUnlocked) return;
    audioUnlocked = true;
    statusText.textContent = '音訊已解鎖，之後新一句 SPEAKER A 會自動朗讀。';
    if (pairs.length && getCurrent().A) speak(getCurrent().A, 0.8);
  }

  function speak(text, rate){
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.8; u.volume = 1;
    window.speechSynthesis.speak(u);
  }
  function speakA(text){
    if (audioUnlocked) speak(text, 0.8);
    else statusText.textContent = '請先點一下畫面解鎖聲音，再按播放。';
  }

  function playSuccessSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
  }

  function speakSubSentenceSlow(){
    const fullText = getCurrent().B;
    if (!fullText) return;
    if (firstErrorWordIndex === -1) {
      speak(fullText, 0.4);
      statusText.textContent = '已用 0.4 倍慢速播放整句。';
      return;
    }
    const rawWords = fullText.split(/\s+/);
    let subStart = 0;
    let subEnd = rawWords.length;
    let currentStart = 0;
    for (let i = 0; i < rawWords.length; i++) {
      if (rawWords[i].includes('.') || rawWords[i].includes('?') || rawWords[i].includes('!')) {
        let currentEnd = i;
        if (firstErrorWordIndex >= currentStart && firstErrorWordIndex <= currentEnd) {
          subStart = currentStart;
          subEnd = currentEnd + 1;
          break;
        }
        currentStart = i + 1;
      }
    }
    if (firstErrorWordIndex >= currentStart) {
      subStart = currentStart;
      subEnd = rawWords.length;
    }
    const subSentence = rawWords.slice(subStart, subEnd).join(' ');
    speak(subSentence, 0.4);
    statusText.textContent = `已用 0.4 倍慢速播放出錯的子句：「${subSentence}」`;
  }

  function initScript() {
    const saved = localStorage.getItem('ws_script');
    if (saved){
      try {
        const o = JSON.parse(saved);
        scriptA.value = (o.A || defaultA).replace(/\r/g,'');
        scriptB.value = (o.B || defaultB).replace(/\r/g,'');
      } catch(e) {
        scriptA.value = defaultA;
        scriptB.value = defaultB;
      }
    } else {
      scriptA.value = defaultA;
      scriptB.value = defaultB;
    }
    parseAndLoadPairs(scriptA.value, scriptB.value);
  }

  function updateScript() {
    const rawA = scriptA.value.replace(/\r/g,'');
    const rawB = scriptB.value.replace(/\r/g,'');
    localStorage.setItem('ws_script', JSON.stringify({ A: rawA, B: rawB }));
    parseAndLoadPairs(rawA, rawB);
    statusText.textContent = '劇本已更新成功，已從第一組對話開始！';
  }

  function parseAndLoadPairs(rawA, rawB) {
    pairs.length = 0;
    const linesA = rawA.split('\n').map(s=>s.trim()).filter(s=>s!=='');
    const linesB = rawB.split('\n').map(s=>s.trim()).filter(s=>s!=='');

    const maxLines = Math.max(linesA.length, linesB.length);
    for (let i = 0; i < maxLines; i++) {
      const a = linesA[i] || '';
      const b = linesB[i] || '';
      pairs.push({ A: a, B: b });
    }
    if (pairs.length === 0) {
      pairs.push({ A: defaultA.split('\n')[0].trim(), B: defaultB.split('\n')[0].trim() });
    }
    currentIdx = 0;
    renderRound();
  }

  function renderRound(){
    const p = getCurrent();
    lineA.textContent = p.A || '（無 A 台詞）';
    lineB.textContent = p.B;
    userInput.value = '';
    heardText.textContent = '（說英文後，辨識結果會顯示在這裡）';
    heardText.className = 'heard-text placeholder';
    diffView.className = 'diff-view';
    nextBtn.disabled = true;
    slowBtn.disabled = true;
    checkBtn.disabled = false;
    recBtn.disabled = false;
    firstErrorWordIndex = -1;
    if (audioUnlocked && p.A) speak(p.A, 0.8);
  }

  function doCheck(){
    const currentB = getCurrent().B;
    const raw = processNameCorrections(userInput.value.trim(), currentB);
    if(!raw){ statusText.textContent = '請先說話或輸入文字，再按檢查。'; return; }
    
    const cleanStr = (s) => s.toLowerCase().replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
    
    const correctRaw = currentB;
    const userRaw = raw;
    const cWords = cleanStr(correctRaw).split(' ');
    const uWords = cleanStr(userRaw).split(' ');
    const ok = (cWords.join(' ') === uWords.join(' '));
    let correctHtml = '<span class="d-label good">正確：</span>';
    let userHtml = '<span class="d-label bad">你的：</span>';
    const maxLen = Math.max(cWords.length, uWords.length);
    let cArr = [];
    let uArr = [];
    firstErrorWordIndex = -1;
    for (let i = 0; i < maxLen; i++) {
      let cw = cWords[i] || '';
      let uw = uWords[i] || '';
      if (cw === uw) {
        cArr.push(cw);
        uArr.push(uw);
      } else {
        if (firstErrorWordIndex === -1) {
          firstErrorWordIndex = i;
        }
        if (cw) cArr.push(`<span class="diff-red">${cw}</span>`);
        if (uw) uArr.push(`<span class="diff-red">${uw}</span>`);
      }
    }
    correctHtml += cArr.join(' ');
    userHtml += uArr.join(' ');
    diffCorrect.innerHTML = correctHtml;
    diffUser.innerHTML = userHtml;
    diffView.className = 'diff-view show';
    if(ok){
      statusText.textContent = '句子比對正確！';
      nextBtn.disabled = false; 
      slowBtn.disabled = true;
      checkBtn.disabled = true;
      recBtn.disabled = true;
      playSuccessSound();
      successOverlay.classList.add('show');
      setTimeout(() => {
        successOverlay.classList.remove('show');
        nextRound();
      }, 1200);
    }else{
      statusText.textContent = '有單字或拼寫差異（紅字部分），點擊慢速按鈕可聆聽出錯的該子句。';
      speakSubSentenceSlow();
      slowBtn.disabled = false; 
      nextBtn.disabled = true;
    }
  }

  function nextRound(){
    currentIdx++;
    if(currentIdx >= pairs.length){
      statusText.textContent = '全部對話練習完畢！';
      nextBtn.disabled = true; checkBtn.disabled = true; recBtn.disabled = true;
      return;
    }
    renderRound();
  }

  function initRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      recBtn.disabled = true; recLabel.textContent = '不支援語音辨識';
      micState.textContent = '請改用 Chrome / Edge / Safari';
      statusText.textContent = '提示：此瀏覽器不支援 Web Speech 語音辨識，請改用 Chrome 或 Edge。';
      return;
    }
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.onstart = () => { 
      recLabel.textContent = '聆聽中…'; 
      micState.textContent = '請開始說英文'; 
      statusText.textContent = '正在聆聽您的語音，請對麥克風說出標準答案...';
    };
    recognition.onresult = (ev) => {
      let text = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++)
        text += ev.results[i][0].transcript;
      
      const currentB = getCurrent().B;
      const fixedText = processNameCorrections(text, currentB);

      heardText.textContent = fixedText;
      heardText.className = 'heard-text';
      userInput.value = fixedText;
      micState.textContent = '辨識完成';
      statusText.textContent = '語音辨識完畢（已校正名字發音），可以點擊「檢查句子」或按 Enter。';
    };
    recognition.onerror = (ev) => {
      recLabel.textContent = '開始說話';
      micState.textContent = '錯誤：' + ev.error;
      statusText.textContent = '語音辨識發生錯誤：' + ev.error;
    };
    recognition.onend = () => { 
      recLabel.textContent = '開始說話'; 
      recBtn.classList.remove('listening'); 
    };
  }

  recBtn.onclick = (e) => {
    e.stopPropagation();
    if(!recognition) return;
    recBtn.classList.add('listening');
    try { recognition.start(); }
    catch(err){ 
      recBtn.classList.remove('listening'); 
      micState.textContent = '無法啟動';
      statusText.textContent = '無法啟動麥克風辨識：' + err.message;
    }
  };

  userInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doCheck(); } });
  
  initScript();
  initRecognition();
</script>
</body>
</html>
